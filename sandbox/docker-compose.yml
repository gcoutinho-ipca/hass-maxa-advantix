# A throwaway Home Assistant with a simulated heat pump behind it.
#
# Two modes, both explicit, because "comment out this line" is a bad instruction
# to leave in a file people copy.
#
#   Working tree (development):
#       docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
#   Published release, the way a user gets it:
#       ./install-from-github.sh && docker compose up -d
#
# Then open http://localhost:8123 and add the integration from the UI, pointing it
# at host "maxa-sim", port 502.
#
# The simulator runs in READ-ONLY mode by default: every write is refused with a
# Modbus exception and logged. That is deliberate. This sandbox cannot command
# anything, and you can prove an integration is not writing by reading the
# simulator's log rather than by trusting it.
#
# To exercise the control side, or to raise a fault:
#     MAXA_SIM_ARGS="" docker compose up -d --force-recreate maxa-sim
#     MAXA_SIM_ARGS="--read-only --fault E042 --flow-meter" \
#       docker compose up -d --force-recreate maxa-sim

services:
  maxa-sim:
    image: python:3.13-alpine
    container_name: maxa-sim
    restart: unless-stopped
    command: >
      python /simulator/modbus_simulator.py
      --host 0.0.0.0
      --port 502
      ${MAXA_SIM_ARGS:---read-only}
    volumes:
      - ../scripts/modbus_simulator.py:/simulator/modbus_simulator.py:ro
    # Not published to the host: nothing outside this compose network needs to
    # reach it, and a Modbus port on a host interface is the one thing SECURITY.md
    # tells people not to create.
    expose:
      - "502"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: maxa-ha
    restart: unless-stopped
    depends_on:
      - maxa-sim
    environment:
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - ./ha-config:/config
    ports:
      - "127.0.0.1:8123:8123"
