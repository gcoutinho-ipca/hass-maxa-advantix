set_mode:
  fields:
    mode:
      required: true
      example: heating_dhw
      selector:
        select:
          translation_key: machine_state
          options:
            - standby
            - cooling
            - heating
            - dhw
            - cooling_dhw
            - heating_dhw
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: maxa_advantix

set_dhw_setpoint:
  fields:
    temperature:
      required: true
      example: 48
      selector:
        number:
          min: 25
          max: 55
          step: 0.5
          unit_of_measurement: "°C"
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: maxa_advantix

start_legionella:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: maxa_advantix

release_control:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: maxa_advantix

read_register:
  fields:
    address:
      required: true
      example: 401
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: maxa_advantix
