blueprint:
  name: "MAXA: hot water with wide hysteresis and anti-cycling"
  description: >-
    Governs domestic hot water with a wide hysteresis band of your own choosing,
    instead of the controller's narrow internal differential, and refuses to
    start a new production run until the compressor has rested.

    Why you would want this: the controller's own differential is not exposed
    over Modbus, and on many installations it is tight enough to cause short
    cycling: dozens of two-minute compressor runs a day, which wears the machine
    and wastes energy on start-up losses. The trick is to set the machine's own
    DHW setpoint deliberately *above* your `stop at` value, so the machine never
    reaches its own cut-off and this automation's wide band is what actually
    governs.

    The two brakes (compressor rest and flow gating) only ever delay a *new*
    start; they never interrupt a run in progress, and both give way when the
    tank falls below the emergency threshold, because at that point reheating
    matters more than being gentle.
  domain: automation
  source_url: https://github.com/gcoutinho-ipca/hass-maxa-advantix/blob/main/blueprints/automation/maxa_advantix/dhw_hysteresis.yaml
  author: gcoutinho <gcoutinho@gmail.com>
  input:
    machine:
      name: Hot water entity
      description: The water heater entity created by the MAXA integration.
      selector:
        entity:
          filter:
            domain: water_heater
            integration: maxa_advantix
    tank_temperature:
      name: Tank temperature sensor
      description: >-
        Usually the integration's "Hot water tank" sensor. Use a different probe
        if you have one you trust more, for example one nearer the draw-off.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature
    thresholds:
      name: Hysteresis band
      icon: mdi:thermometer-lines
      collapsed: false
      input:
        start_below:
          name: Start below
          description: Begin producing hot water when the tank falls below this.
          default: 40
          selector:
            number:
              min: 20
              max: 55
              step: 0.5
              unit_of_measurement: "°C"
        stop_at:
          name: Stop at
          description: >-
            Stop when the tank reaches this. Keep the machine's own DHW setpoint
            one or two degrees above this value so your band is the one in
            charge.
          default: 46
          selector:
            number:
              min: 25
              max: 55
              step: 0.5
              unit_of_measurement: "°C"
        emergency_below:
          name: Emergency threshold
          description: >-
            Below this, produce hot water regardless of rest time, flow gating or
            any block condition.
          default: 38
          selector:
            number:
              min: 15
              max: 50
              step: 0.5
              unit_of_measurement: "°C"
    minimum_rest:
      name: Minimum compressor rest
      description: >-
        How long hot water must have been off before a new run may start. This is
        the anti-cycling brake.
      default: 10
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: min
    maximum_run:
      name: Maximum run time
      description: >-
        Give up after this long without reaching the target, and let the tank
        rest. Zero disables the timeout.
      default: 60
      selector:
        number:
          min: 0
          max: 240
          step: 5
          unit_of_measurement: min
    flow_protection:
      name: Flow protection
      icon: mdi:water-alert
      collapsed: true
      input:
        flow_restricted:
          name: Flow restricted sensor
          description: >-
            The integration's "Flow restricted" binary sensor. When it is on and
            the outlet water is already warm, a new run is postponed: pushing a
            restricted circuit further only trips the high-temperature
            protection.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
                integration: maxa_advantix
        outlet_temperature:
          name: Outlet water sensor
          description: The integration's "Water outlet" sensor.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
                integration: maxa_advantix
        outlet_warning:
          name: Outlet warning temperature
          description: >-
            Postpone new runs above this outlet temperature while flow is
            restricted. Keep it a few degrees below the machine's own
            high-temperature limit so you never reach the protection.
          default: 53
          selector:
            number:
              min: 30
              max: 60
              step: 0.5
              unit_of_measurement: "°C"
    block_entities:
      name: Block conditions
      description: >-
        Any of these being on suppresses hot water production: a schedule, an
        away toggle, or the flag set by the solar priority blueprint. The
        emergency threshold overrides all of them.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: input_boolean
            - domain: binary_sensor
            - domain: schedule

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input tank_temperature
  - trigger: time_pattern
    minutes: "/1"

variables:
  machine: !input machine
  tank: !input tank_temperature
  start_below: !input start_below
  stop_at: !input stop_at
  emergency_below: !input emergency_below
  minimum_rest: !input minimum_rest
  maximum_run: !input maximum_run
  blocks: !input block_entities
  flow_sensors: !input flow_restricted
  outlet_sensors: !input outlet_temperature
  outlet_warning: !input outlet_warning
  tank_value: "{{ states(tank) | float(-1) }}"
  producing: "{{ not is_state(machine, 'off') }}"
  emergency: "{{ tank_value >= 0 and tank_value < emergency_below }}"
  blocked: "{{ blocks | select('is_state', 'on') | list | count > 0 }}"
  flow_restricted_now: "{{ flow_sensors | select('is_state', 'on') | list | count > 0 }}"
  outlet_value: >-
    {% set values = outlet_sensors | map('states') | map('float', -999) | list %}
    {{ values | max if values else -999 }}
  flow_gate: "{{ flow_restricted_now and outlet_value > outlet_warning }}"

conditions:
  # A tank that is not reporting is not a reason to act. -1 means the probe is
  # unavailable, and guessing on missing data is how you cook a cylinder.
  - condition: template
    value_template: "{{ tank_value >= 0 }}"

actions:
  - choose:
      # Emergency: reheat now, ignoring every brake and block.
      - conditions:
          - condition: template
            value_template: "{{ emergency and not producing }}"
        sequence:
          - action: water_heater.turn_on
            target:
              entity_id: !input machine
      # Target reached, or blocked while not in an emergency: stop.
      - conditions:
          - condition: template
            value_template: >-
              {{ producing and (tank_value >= stop_at or (blocked and not emergency)) }}
        sequence:
          - action: water_heater.turn_off
            target:
              entity_id: !input machine
      # Ran too long without reaching the target: give up and let it rest.
      - conditions:
          - condition: template
            value_template: "{{ producing and maximum_run > 0 and not emergency }}"
          - condition: state
            entity_id: !input machine
            state: heat_pump
            for:
              minutes: !input maximum_run
        sequence:
          - action: water_heater.turn_off
            target:
              entity_id: !input machine
      # Normal start: below the band, rested long enough, nothing blocking.
      - conditions:
          - condition: template
            value_template: >-
              {{ not producing and tank_value < start_below
                 and not blocked and not flow_gate }}
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ minimum_rest == 0 }}"
              - condition: state
                entity_id: !input machine
                state: "off"
                for:
                  minutes: !input minimum_rest
        sequence:
          - action: water_heater.turn_on
            target:
              entity_id: !input machine
